name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install openai python-dotenv

      - name: Check Python syntax
        run: python -m compileall -q main.py

      - name: Check application imports
        env:
          API_KEY: ci-placeholder
        run: python -c "import main"
